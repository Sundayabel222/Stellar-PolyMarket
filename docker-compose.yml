version: "3.8"

services:
  stellar-quickstart:
    image: stellar/quickstart:testing
    container_name: stellar-quickstart
    # --local runs a standalone network. --enable-soroban-rpc turns on the Soroban RPC server.
    command: --local --enable-soroban-rpc
    ports:
      - "8000:8000" # Horizon API
      - "8001:8001" # Soroban RPC
    volumes:
      - stellar-data:/opt/stellar/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stellar-polymarket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: polymarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - stellar-quickstart
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/polymarket
      REDIS_URL: redis://redis:6379
      STELLAR_HORIZON: http://stellar-quickstart:8000
    volumes:
      - ./backend:/app
    command: npm run dev

volumes:
  stellar-data:
    name: stellar_polymarket_data
  redis-data:
    name: stellar_polymarket_redis_data
  postgres-data:
